# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
      runs-on:  macos-15 # ensures macOS 15 + Xcode 16
      steps:
      - uses: actions/checkout@v4
      
      - name: Use Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer
        
      # - name: Create simulator
      #   run: |
      #    xcrun simctl create "TestPhone" "com.apple.CoreSimulator.SimDeviceType.iPhone-15-Pro" "com.apple.CoreSimulator.SimRuntime.iOS-18-0"
      #    xcrun simctl boot "TestPhone"
      #    xcrun simctl list devices
        
      - name: Build
        working-directory: TaskManagerApp
        run: |
          xcodebuild \
          -scheme TaskManagerApp \
          -sdk iphonesimulator \
          build \
          CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
          -destination 'generic/platform=iOS Simulator'

      - name: Run tests
        working-directory: TaskManagerApp
        run: |
          xcodebuild -scheme TaskManagerApp -sdk iphonesimulator build
